<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Yunitt">
<meta name="theme-color" content="#8B5E3C">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500;600&display=swap">
<title>Yunitt</title>
<style>
/* ── Design tokens ─────────────────────────────────────── */
:root {
  --bg:        #FAF8F5;
  --surface:   #FFFFFF;
  --surface2:  #F2EDE7;
  --border:    #E4DDD5;
  --fg:        #2C2118;
  --fg2:       #7A6A5A;
  --accent:    #8B5E3C;
  --accent-lt: #F0E6DC;
  --tag-yarn:  #4A7B6F;
  --tag-yarn-lt: #DFF0EC;
  --tag-needle:#7B5EA7;
  --tag-needle-lt:#EDE8F7;
  --shadow:    0 2px 12px rgba(44,33,24,.08);
  --shadow-lg: 0 8px 32px rgba(44,33,24,.14);
  --radius:    14px;
  --radius-sm: 8px;
  --tab-h:     68px;
  --header-h:  56px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#1A1410; --surface:#251E17; --surface2:#2F2620; --border:#3D3228;
    --fg:#F2EAE0; --fg2:#A08870; --accent:#C4895A; --accent-lt:#3A2A1A;
    --tag-yarn-lt:#1A2E2B; --tag-needle-lt:#2A2238; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg:#1A1410; --surface:#251E17; --surface2:#2F2620; --border:#3D3228;
  --fg:#F2EAE0; --fg2:#A08870; --accent:#C4895A; --accent-lt:#3A2A1A;
  --tag-yarn-lt:#1A2E2B; --tag-needle-lt:#2A2238; color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; font-family: 'DM Sans', system-ui, sans-serif;
  background: var(--bg); color: var(--fg); font-size: 15px; line-height: 1.5; }

/* ── App shell ─────────────────────────────────────────── */
.app { display: flex; flex-direction: column; height: 100%;
  max-width: 480px; margin: 0 auto; background: var(--bg); }

/* ── Header ───────────────────────────────────────────── */
.header {
  height: var(--header-h);
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  padding-top: env(safe-area-inset-top, 0px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-bottom: 0;
  height: calc(var(--header-h) + env(safe-area-inset-top, 0px));
  flex-shrink: 0;
  position: sticky; top: 0; z-index: 10;
}
.header-logo { font-family: 'DM Sans', sans-serif; font-size: 22px;
  font-weight: 600; color: var(--fg); letter-spacing: 2px; text-transform: uppercase; display: flex; align-items: center; gap: 8px; }
.header-logo .logo-icon { width: 28px; height: 28px; background: linear-gradient(135deg, #2C2118 0%, #4A3728 100%); border-radius: 7px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.header-logo .logo-yun { color: var(--fg); }
.header-logo .logo-itt { color: var(--accent); font-weight: 400; }
.header-actions { display: flex; gap: 8px; }
.icon-btn { background: none; border: none; cursor: pointer; padding: 6px;
  border-radius: 8px; color: var(--fg2); display: flex; align-items: center;
  transition: background .15s, color .15s; }
.icon-btn:hover, .icon-btn:active { background: var(--surface2); color: var(--fg); }
.icon-btn svg { width: 22px; height: 22px; }

/* ── Main scroll ──────────────────────────────────────── */
.main { flex: 1; overflow-y: auto; overflow-x: hidden;
  padding-bottom: calc(var(--tab-h) + env(safe-area-inset-bottom, 0px) + 8px);
  -webkit-overflow-scrolling: touch; }

/* ── Tab bar ──────────────────────────────────────────── */
.tab-bar {
  height: calc(var(--tab-h) + env(safe-area-inset-bottom, 0px));
  background: var(--surface); border-top: 1px solid var(--border);
  display: flex; align-items: flex-start;
  position: sticky; bottom: 0; z-index: 10; flex-shrink: 0;
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: env(safe-area-inset-left, 0px);
  padding-right: env(safe-area-inset-right, 0px);
}
.tab-btn { flex: 1; display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 3px; background: none; border: none; cursor: pointer;
  color: var(--fg2); font-family: 'DM Sans', sans-serif; font-size: 10.5px;
  font-weight: 500; letter-spacing: .3px; padding: 10px 4px 8px;
  transition: color .15s; position: relative; -webkit-tap-highlight-color: transparent; }
.tab-btn svg { width: 22px; height: 22px; }
.tab-btn.active { color: var(--accent); }
.tab-btn.active::before { content: ''; position: absolute; top: 0; left: 20%; right: 20%;
  height: 2px; background: var(--accent); border-radius: 0 0 2px 2px; }

/* ── Tab panels ───────────────────────────────────────── */
.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* ── Section header ───────────────────────────────────── */
.section-head { padding: 20px max(16px,env(safe-area-inset-left,0px)) 12px;
  display: flex; align-items: center; justify-content: space-between; }
.section-title { font-family: 'Playfair Display', serif; font-size: 24px;
  font-weight: 600; color: var(--fg); margin: 0; text-wrap: balance; }
.section-sub { font-size: 13px; color: var(--fg2); margin: 2px 0 0; }

/* ── FAB ──────────────────────────────────────────────── */
.fab { display: inline-flex; align-items: center; gap: 6px; background: var(--accent);
  color: #fff; border: none; border-radius: 24px; padding: 8px 16px 8px 12px;
  font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer;
  box-shadow: 0 3px 12px rgba(139,94,60,.35); transition: opacity .15s, transform .1s;
  -webkit-tap-highlight-color: transparent; }
.fab:active { opacity: .85; transform: scale(.97); }
.fab svg { width: 18px; height: 18px; }

/* ── Chips ────────────────────────────────────────────── */
.chip { display: inline-block; padding: 3px 10px; border-radius: 20px;
  font-size: 11px; font-weight: 600; letter-spacing: .4px; text-transform: uppercase; }
.chip-active { background: #E8F4E8; color: #2D7A4F; }
.chip-paused { background: #FFF3CD; color: #8A6A00; }
.chip-done   { background: var(--surface2); color: var(--fg2); }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .chip-active { background: #1A3A2A; color: #6FD69F; }
  :root:not([data-theme="light"]) .chip-paused { background: #3A2E0A; color: #FFD97A; }
}
:root[data-theme="dark"] .chip-active { background: #1A3A2A; color: #6FD69F; }
:root[data-theme="dark"] .chip-paused { background: #3A2E0A; color: #FFD97A; }

/* ── Cards ────────────────────────────────────────────── */
.cards { display: flex; flex-direction: column; gap: 12px;
  padding: 0 max(16px,env(safe-area-inset-left,0px)) 8px; }
.card { background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden;
  cursor: pointer; -webkit-tap-highlight-color: transparent; transition: box-shadow .15s; }
.card:active { box-shadow: var(--shadow-lg); }
.card-img { width: 100%; aspect-ratio: 16/8; background: var(--surface2);
  display: flex; align-items: center; justify-content: center; }
.card-img svg { width: 48px; height: 48px; color: var(--border); }
.card-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card-body { padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.card-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.card-name { font-family: 'Playfair Display', serif; font-size: 17px; font-weight: 600;
  color: var(--fg); min-width: 0; }
.card-meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
  font-size: 12.5px; color: var(--fg2); }
.card-meta-item { display: flex; align-items: center; gap: 4px; }
.card-meta-item svg { width: 13px; height: 13px; flex-shrink: 0; }
.progress-bar { height: 4px; background: var(--surface2); border-radius: 2px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--accent); border-radius: 2px; }
.tag { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px;
  border-radius: 6px; font-size: 11.5px; font-weight: 500; }
.tag-yarn   { background: var(--tag-yarn-lt); color: var(--tag-yarn); }
.tag-needle { background: var(--tag-needle-lt); color: var(--tag-needle); }

/* ── Filter row ───────────────────────────────────────── */
.filter-row { display: flex; gap: 8px;
  padding: 0 max(16px,env(safe-area-inset-left,0px)) 12px;
  overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.filter-row::-webkit-scrollbar { display: none; }
.filter-btn { background: var(--surface); border: 1.5px solid var(--border);
  color: var(--fg2); border-radius: 20px; padding: 5px 14px;
  font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500;
  cursor: pointer; white-space: nowrap; transition: all .15s;
  -webkit-tap-highlight-color: transparent; }
.filter-btn.active, .filter-btn:active {
  background: var(--accent-lt); border-color: var(--accent); color: var(--accent); }

/* ── Modal ────────────────────────────────────────────── */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45);
  z-index: 100; display: flex; align-items: flex-end;
  opacity: 0; pointer-events: none; transition: opacity .25s; }
.modal-overlay.open { opacity: 1; pointer-events: all; }
.modal { background: var(--surface); border-radius: var(--radius) var(--radius) 0 0;
  width: 100%; max-height: 92vh; overflow-y: auto;
  transform: translateY(100%); transition: transform .3s cubic-bezier(.32,0,.67,0);
  padding-bottom: max(24px, env(safe-area-inset-bottom, 0px)); }
.modal-overlay.open .modal { transform: translateY(0); transition: transform .3s cubic-bezier(.33,1,.68,1); }
.modal-handle { width: 40px; height: 4px; background: var(--border);
  border-radius: 2px; margin: 12px auto 4px; }
.modal-header { padding: 12px 20px 16px; display: flex; align-items: center;
  justify-content: space-between; border-bottom: 1px solid var(--border); }
.modal-title { font-family: 'Playfair Display', serif; font-size: 20px; font-weight: 600; margin: 0; }
.modal-close { background: var(--surface2); border: none; width: 32px; height: 32px;
  border-radius: 50%; font-size: 18px; cursor: pointer; color: var(--fg2);
  display: flex; align-items: center; justify-content: center; transition: background .15s; }
.modal-body { padding: 20px; display: flex; flex-direction: column; gap: 16px; }

/* ── Forms ────────────────────────────────────────────── */
.field { display: flex; flex-direction: column; gap: 5px; }
.field label { font-size: 12.5px; font-weight: 600; color: var(--fg2);
  letter-spacing: .4px; text-transform: uppercase; }
.field input, .field textarea, .field select {
  background: var(--bg); border: 1.5px solid var(--border); border-radius: var(--radius-sm);
  padding: 10px 12px; font-family: 'DM Sans', sans-serif; font-size: 16px;
  color: var(--fg); width: 100%; transition: border-color .15s; outline: none;
  -webkit-appearance: none; appearance: none; }
.field input:focus, .field textarea:focus, .field select:focus { border-color: var(--accent); }
.field textarea { resize: vertical; min-height: 80px; }
.field-row  { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.field-row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
.photo-upload { border: 2px dashed var(--border); border-radius: var(--radius);
  padding: 24px; text-align: center; color: var(--fg2); font-size: 13px;
  cursor: pointer; transition: border-color .15s, background .15s;
  display: flex; flex-direction: column; align-items: center; gap: 8px; }
.photo-upload:active { border-color: var(--accent); background: var(--accent-lt); }
.photo-upload svg { width: 32px; height: 32px; opacity: .5; }
.photo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 4px; }
.photo-thumb { aspect-ratio: 1; background: var(--surface2); border-radius: var(--radius-sm);
  overflow: hidden; position: relative; }
.photo-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photo-rm { position: absolute; top: 4px; right: 4px; background: rgba(0,0,0,.55);
  color: #fff; border: none; border-radius: 50%; width: 22px; height: 22px;
  font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.btn-save { background: var(--accent); color: #fff; border: none;
  border-radius: var(--radius-sm); padding: 14px;
  font-family: 'DM Sans', sans-serif; font-size: 16px; font-weight: 600;
  cursor: pointer; width: 100%; transition: opacity .15s; -webkit-tap-highlight-color: transparent; }
.btn-save:active { opacity: .85; }

/* ── Storage ──────────────────────────────────────────── */
.storage-tabs { display: flex; margin: 0 max(16px,env(safe-area-inset-left,0px)) 16px;
  background: var(--surface2); border-radius: var(--radius-sm); padding: 4px; }
.storage-tab { flex: 1; background: none; border: none; border-radius: 6px; padding: 8px;
  font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500;
  color: var(--fg2); cursor: pointer; transition: all .15s; -webkit-tap-highlight-color: transparent; }
.storage-tab.active { background: var(--surface); color: var(--fg);
  box-shadow: 0 1px 6px rgba(44,33,24,.1); }
.yarn-card, .needle-card { background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 14px 16px; display: flex; gap: 14px;
  align-items: center; box-shadow: var(--shadow); }
.yarn-swatch { width: 44px; height: 44px; border-radius: 50%; flex-shrink: 0;
  border: 3px solid var(--surface); box-shadow: 0 0 0 1.5px var(--border); }
.yarn-info { flex: 1; min-width: 0; }
.yarn-name { font-weight: 600; font-size: 15px; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; }
.yarn-detail { font-size: 12.5px; color: var(--fg2); margin-top: 2px; }
.yarn-qty { font-size: 13px; font-weight: 600; color: var(--accent); white-space: nowrap; }
.needle-icon { width: 44px; height: 44px; background: var(--tag-needle-lt);
  border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.needle-icon svg { width: 24px; height: 24px; color: var(--tag-needle); }

/* ── Wish list ────────────────────────────────────────── */
.wish-card { background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden;
  display: flex; }
.wish-bar { width: 5px; flex-shrink: 0; }
.wish-body { padding: 14px 16px; flex: 1; min-width: 0; }
.wish-name { font-family: 'Playfair Display', serif; font-size: 16px; font-weight: 600; }
.wish-meta { font-size: 12.5px; color: var(--fg2); margin-top: 4px;
  display: flex; flex-wrap: wrap; gap: 8px; }
.wish-link { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px;
  color: var(--accent); text-decoration: none; margin-top: 6px; font-weight: 500; }
.wish-actions { display: flex; align-items: center; padding: 14px 12px 14px 0; gap: 4px; }

/* ── Pattern grid ─────────────────────────────────────── */
.patterns-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
  padding: 0 max(16px,env(safe-area-inset-left,0px)); }
.pattern-card { background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden;
  cursor: pointer; -webkit-tap-highlight-color: transparent; }
.pattern-thumb { aspect-ratio: 4/3; background: var(--surface2);
  display: flex; align-items: center; justify-content: center; overflow: hidden; }
.pattern-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pattern-thumb svg { width: 40px; height: 40px; color: var(--border); }
.pattern-info { padding: 12px 14px; }
.pattern-name { font-family: 'Playfair Display', serif; font-size: 15px; font-weight: 600; }
.pattern-designer { font-size: 12.5px; color: var(--fg2); margin-top: 2px; }

/* ── Empty state ──────────────────────────────────────── */
.empty { text-align: center; padding: 48px 32px; color: var(--fg2); }
.empty svg { width: 64px; height: 64px; opacity: .25; margin-bottom: 12px; display: block; margin-inline: auto; }
.empty-title { font-family: 'Playfair Display', serif; font-size: 20px;
  color: var(--fg); margin-bottom: 6px; }
.empty p { font-size: 14px; margin: 0 0 20px; }

/* ── Detail view ──────────────────────────────────────── */
.detail-header { padding: 16px max(16px,env(safe-area-inset-left,0px)) 0;
  display: flex; gap: 12px; align-items: center; }
.back-btn { background: var(--surface2); border: none; border-radius: 10px;
  width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--fg); flex-shrink: 0; transition: background .15s;
  -webkit-tap-highlight-color: transparent; }
.back-btn svg { width: 20px; height: 20px; }
.detail-body { padding: 16px max(16px,env(safe-area-inset-left,0px));
  display: flex; flex-direction: column; gap: 16px; }
.detail-section-title { font-size: 11px; font-weight: 700; letter-spacing: 1px;
  text-transform: uppercase; color: var(--fg2); margin-bottom: 8px; }
.info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.info-box { background: var(--surface2); border-radius: var(--radius-sm); padding: 10px 12px; }
.info-box-label { font-size: 11px; color: var(--fg2); font-weight: 600;
  text-transform: uppercase; letter-spacing: .5px; }
.info-box-value { font-size: 15px; font-weight: 600; color: var(--fg); margin-top: 2px; }

/* ── Install banner ───────────────────────────────────── */
#installBanner { display: none; background: var(--accent-lt); border-bottom: 1px solid var(--border);
  padding: 10px max(16px,env(safe-area-inset-left,0px)); font-size: 13px; color: var(--accent);
  align-items: center; gap: 10px; }
#installBanner button { background: var(--accent); color: #fff; border: none;
  border-radius: 8px; padding: 6px 14px; font-size: 13px; font-weight: 600; cursor: pointer; }
#installBanner.show { display: flex; }
</style>
</head>
<body>

<div class="app">
  <!-- Install prompt (Android/desktop Chrome) -->
  <div id="installBanner">
    <span style="flex:1">📲 Add Yunitt to your home screen</span>
    <button id="installBtn">Install</button>
    <button onclick="this.parentElement.classList.remove('show')"
      style="background:none;border:none;color:var(--fg2);font-size:18px;cursor:pointer;padding:0 4px;">✕</button>
  </div>

  <header class="header">
    <div class="header-logo">
      <div class="logo-icon">
        <svg width="18" height="18" viewBox="0 0 68 68" fill="none">
          <line x1="12" y1="56" x2="52" y2="12" stroke="#C4895A" stroke-width="5" stroke-linecap="round"/>
          <line x1="52" y1="56" x2="12" y2="12" stroke="#FAF8F5" stroke-width="5" stroke-linecap="round" stroke-dasharray="8 6"/>
          <circle cx="52" cy="12" r="6" fill="#C4895A"/>
          <circle cx="12" cy="12" r="6" fill="#FAF8F5"/>
        </svg>
      </div>
      <span class="logo-yun">YUN</span><span class="logo-itt">ITT</span>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="themeToggle" title="Toggle theme" aria-label="Toggle theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
    </div>
  </header>

  <main class="main" id="mainContent">

    <!-- PROJECTS -->
    <section class="tab-panel active" id="panel-projects">
      <div id="projectsList">
        <div class="section-head">
          <div>
            <h1 class="section-title">My Projects</h1>
            <p class="section-sub">Track your knitting journey</p>
          </div>
          <button class="fab" id="addProjectBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
            </svg>New
          </button>
        </div>
        <div class="filter-row">
          <button class="filter-btn active" data-filter="all">All</button>
          <button class="filter-btn" data-filter="active">Active</button>
          <button class="filter-btn" data-filter="paused">Paused</button>
          <button class="filter-btn" data-filter="done">Finished</button>
        </div>
        <div class="cards" id="projectCards"></div>
      </div>
      <div id="projectDetail" style="display:none;"></div>
    </section>

    <!-- PATTERNS -->
    <section class="tab-panel" id="panel-patterns">
      <div class="section-head">
        <div>
          <h1 class="section-title">Patterns</h1>
          <p class="section-sub">Your pattern library</p>
        </div>
        <button class="fab" id="addPatternBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
          </svg>Add
        </button>
      </div>
      <div class="filter-row">
        <button class="filter-btn active" data-pfilter="all">All</button>
        <button class="filter-btn" data-pfilter="sweater">Sweaters</button>
        <button class="filter-btn" data-pfilter="accessory">Accessories</button>
        <button class="filter-btn" data-pfilter="baby">Baby</button>
        <button class="filter-btn" data-pfilter="home">Home</button>
      </div>
      <div class="patterns-grid" id="patternGrid"></div>
    </section>

    <!-- STORAGE -->

<script>
// ── PWA registration ───────────────────────────────────────
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}

// ── Install prompt (Android/desktop) ─────────────────────
let deferredPrompt;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('installBanner').classList.add('show');
});
document.getElementById('installBtn').addEventListener('click', async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  document.getElementById('installBanner').classList.remove('show');
});

// ── State ──────────────────────────────────────────────────
let state = { projects: [], patterns: [], yarns: [], needles: [], future: [] };
try { const s = localStorage.getItem('knitjournal'); if (s) state = { ...state, ...JSON.parse(s) }; } catch(e) {}
function save() { try { localStorage.setItem('knitjournal', JSON.stringify(state)); } catch(e) {} }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

// ── Sample data ────────────────────────────────────────────
if (!state.seeded) {
  state.projects = [
    { id: uid(), name: 'Autumn Highlands Sweater', status: 'active', progress: 45,
      needle: '4.5', needleType: 'Circular', needleLen: '80',
      yarnBrand: 'Sandnes Garn', yarnName: 'Tynn Alpakka', yarnColour: 'Dusty Rose',
      yarnSkeins: 6, pattern: 'Hildes Genser', link: 'https://www.ravelry.com',
      notes: 'Size M, adding 2cm extra length', photos: [] },
    { id: uid(), name: 'Forest Mittens', status: 'done', progress: 100,
      needle: '3.5', needleType: 'DPN', needleLen: '20',
      yarnBrand: 'Drops', yarnName: 'Lima', yarnColour: 'Moss Green',
      yarnSkeins: 1, pattern: 'Woodland Mittens', link: '',
      notes: 'For sister, size S', photos: [] },
    { id: uid(), name: 'Chunky Throw Blanket', status: 'paused', progress: 20,
      needle: '12', needleType: 'Straight', needleLen: '35',
      yarnBrand: 'Garnstudio', yarnName: 'DROPS Snow', yarnColour: 'Cream',
      yarnSkeins: 8, pattern: 'Simple Chunky Throw', link: '',
      notes: 'Put on hold', photos: [] }
  ];
  state.patterns = [
    { id: uid(), name: 'Hildes Genser', designer: 'Sandnes Design', category: 'sweater', needle: '4.5', link: 'https://www.ravelry.com', notes: '', img: '' },
    { id: uid(), name: 'Nora Cardigan', designer: 'PetiteKnit', category: 'sweater', needle: '5.0', link: '', notes: 'Sizes XS–3XL', img: '' },
    { id: uid(), name: 'Woodland Mittens', designer: 'Folk Knitting', category: 'accessory', needle: '3.5', link: '', notes: '', img: '' }
  ];
  state.yarns = [
    { id: uid(), brand: 'Sandnes Garn', name: 'Tynn Alpakka', colour: 'Dusty Rose', hex: '#C4927A', weight: 'Fingering', skeins: 4, metres: 200, grams: 50, fibre: '100% Alpaca', notes: '' },
    { id: uid(), brand: 'Drops', name: 'Lima', colour: 'Forest Green', hex: '#4A7B6F', weight: 'DK', skeins: 6, metres: 190, grams: 50, fibre: '65% Wool, 35% Alpaca', notes: '' },
    { id: uid(), brand: 'Garnstudio', name: 'DROPS Snow', colour: 'Cream', hex: '#F2EDE5', weight: 'Super Bulky', skeins: 8, metres: 50, grams: 100, fibre: '100% Wool', notes: '' }
  ];
  state.needles = [
    { id: uid(), size: '4.5', type: 'Circular', length: '80', material: 'Bamboo', brand: 'Knit Pro', qty: 1, notes: '' },
    { id: uid(), size: '3.5', type: 'DPN', length: '20', material: 'Aluminum', brand: 'Addi', qty: 5, notes: 'Set of 5' },
    { id: uid(), size: '5.0', type: 'Circular', length: '40', material: 'Carbon Fiber', brand: 'ChiaoGoo', qty: 1, notes: '' },
    { id: uid(), size: '12', type: 'Straight', length: '35', material: 'Wood', brand: 'Lykke', qty: 2, notes: '' }
  ];
  state.future = [
    { id: uid(), name: 'Norwegian Star Socks', category: 'Socks', priority: 'high', pattern: 'Selbuvotter variation', link: 'https://www.ravelry.com', yarn: 'Regia 4-ply', notes: 'For Christmas gifts' },
    { id: uid(), name: 'Lace Shawl', category: 'Shawl', priority: 'medium', pattern: 'Feather & Fan', link: '', yarn: 'Merino lace weight', notes: 'Want something delicate for spring' }
  ];
  state.seeded = true;
  save();
}

// ── Theme ──────────────────────────────────────────────────
const root = document.documentElement;
let theme = 'system';
try { theme = localStorage.getItem('kj-theme') || 'system'; } catch(e) {}
function applyTheme(t) {
  if (t==='dark') root.dataset.theme='dark';
  else if (t==='light') root.dataset.theme='light';
  else delete root.dataset.theme;
}
applyTheme(theme);
document.getElementById('themeToggle').addEventListener('click', () => {
  theme = ['system','dark','light'][(['system','dark','light'].indexOf(theme)+1)%3];
  try { localStorage.setItem('kj-theme',theme); } catch(e) {}
  applyTheme(theme);
});

// ── Tabs ───────────────────────────────────────────────────
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const t = btn.dataset.tab;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab===t));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id==='panel-'+t));
    document.getElementById('projectsList').style.display='';
    document.getElementById('projectDetail').style.display='none';
    renderProjects();
  });
});

// ── Modals ─────────────────────────────────────────────────
function openModal(id)  { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
document.querySelectorAll('.modal-overlay').forEach(o => {
  o.addEventListener('click', e => { if (e.target===o) o.classList.remove('open'); });
});

// ── SVG icons ──────────────────────────────────────────────
const IC = {
  needle:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="width:13px;height:13px"><path d="M3 21l12-12M7 7l10 10M14 4l6 6-2 2-6-6 2-2zM4 20l2-2"/></svg>`,
  yarn:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="width:13px;height:13px"><circle cx="12" cy="12" r="9"/><path d="M3.6 9h16.8M3.6 15h16.8M12 3c-2 3-3 5.5-3 9s1 6 3 9M12 3c2 3 3 5.5 3 9s-1 6-3 9"/></svg>`,
  link:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:13px;height:13px"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>`,
  doc:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="width:64px;height:64px"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>`,
  knit:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="width:64px;height:64px"><circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6L5.6 18.4"/></svg>`,
  heart:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="width:64px;height:64px"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>`,
  trash:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="width:22px;height:22px"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6M9 6V4h6v2"/></svg>`,
  back:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:20px;height:20px"><polyline points="15 18 9 12 15 6"/></svg>`,
  play:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:22px;height:22px"><polygon points="5 3 19 12 5 21 5 3"/></svg>`,
  needleBig:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="width:24px;height:24px"><path d="M3 21l12-12M7 7l10 10M14 4l6 6-2 2-6-6 2-2zM4 20l2-2"/></svg>`,
};

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── PROJECTS ───────────────────────────────────────────────
let projectFilter = 'all';
let projectPhotos = [];

function renderProjects() {
  const c = document.getElementById('projectCards');
  const list = projectFilter==='all' ? state.projects
    : state.projects.filter(p => p.status===projectFilter);
  if (!list.length) {
    c.innerHTML=`<div class="empty">${IC.knit}<div class="empty-title">No projects yet</div><p>Start tracking your knitting journey</p></div>`;
    return;
  }
  c.innerHTML = list.map(p => {
    const sc = {active:'chip-active',paused:'chip-paused',done:'chip-done'}[p.status]||'chip-active';
    const sl = {active:'Active',paused:'Paused',done:'Finished'}[p.status]||p.status;
    const prog = parseInt(p.progress)||0;
    const img = p.photos&&p.photos.length
      ? `<div class="card-img" style="padding:0"><img src="${p.photos[0]}" alt="${esc(p.name)}" loading="lazy"></div>`
      : `<div class="card-img">${IC.knit}</div>`;
    return `<div class="card" onclick="showProject('${p.id}')">
      ${img}
      <div class="card-body">
        <div class="card-row">
          <div class="card-name">${esc(p.name)}</div>
          <span class="chip ${sc}">${sl}</span>
        </div>
        <div class="card-meta">
          ${p.needle?`<span class="card-meta-item">${IC.needle} ${esc(p.needle)}mm ${esc(p.needleType||'')}</span>`:''}
          ${p.yarnName?`<span class="card-meta-item">${IC.yarn} ${esc(p.yarnBrand||'')} ${esc(p.yarnName)}</span>`:''}
        </div>
        ${prog>0?`<div>
          <div style="display:flex;justify-content:space-between;margin-bottom:4px;font-size:12px;color:var(--fg2)">
            <span>Progress</span><span style="font-variant-numeric:tabular-nums">${prog}%</span>
          </div>
          <div class="progress-bar"><div class="progress-fill" style="width:${prog}%"></div></div>
        </div>`:''}
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          ${p.yarnColour?`<span class="tag tag-yarn">${esc(p.yarnColour)}</span>`:''}
          ${p.needle?`<span class="tag tag-needle">🪡 ${esc(p.needle)}mm</span>`:''}
        </div>
      </div>
    </div>`;
  }).join('');
}

function showProject(id) {
  const p = state.projects.find(x=>x.id===id); if(!p) return;
  document.getElementById('projectsList').style.display='none';
  const d = document.getElementById('projectDetail');
  d.style.display='block';
  const prog = parseInt(p.progress)||0;
  const sc = {active:'chip-active',paused:'chip-paused',done:'chip-done'}[p.status]||'chip-active';
  const sl = {active:'Active',paused:'Paused',done:'Finished'}[p.status]||p.status;
  const img = p.photos&&p.photos.length
    ? `<img src="${p.photos[0]}" style="width:100%;aspect-ratio:16/9;object-fit:cover;display:block" alt="${esc(p.name)}">`
    : `<div style="width:100%;aspect-ratio:16/9;background:var(--surface2);display:flex;align-items:center;justify-content:center">${IC.knit}</div>`;
  d.innerHTML=`
    <div class="detail-header">
      <button class="back-btn" onclick="backToProjects()">${IC.back}</button>
      <div style="flex:1;min-width:0">
        <div style="font-family:'Playfair Display',serif;font-size:20px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.name)}</div>
        <span class="chip ${sc}">${sl}</span>
      </div>
      <button class="icon-btn" onclick="deleteProject('${p.id}')">${IC.trash}</button>
    </div>
    ${img}
    <div class="detail-body">
      ${prog>0?`<div>
        <div class="detail-section-title">Progress</div>
        <div style="display:flex;align-items:center;gap:10px">
          <div class="progress-bar" style="flex:1;height:8px"><div class="progress-fill" style="width:${prog}%"></div></div>
          <span style="font-size:18px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums">${prog}%</span>
        </div>
      </div>`:''}
      <div>
        <div class="detail-section-title">Needles</div>
        <div class="info-grid">
          <div class="info-box"><div class="info-box-label">Size</div><div class="info-box-value">${esc(p.needle||'—')} mm</div></div>
          <div class="info-box"><div class="info-box-label">Type</div><div class="info-box-value">${esc(p.needleType||'—')}</div></div>
          <div class="info-box"><div class="info-box-label">Length</div><div class="info-box-value">${p.needleLen?esc(p.needleLen)+' cm':'—'}</div></div>
        </div>
      </div>
      <div>
        <div class="detail-section-title">Yarn</div>
        <div class="info-grid">
          <div class="info-box"><div class="info-box-label">Brand</div><div class="info-box-value">${esc(p.yarnBrand||'—')}</div></div>
          <div class="info-box"><div class="info-box-label">Name</div><div class="info-box-value">${esc(p.yarnName||'—')}</div></div>
          <div class="info-box"><div class="info-box-label">Colour</div><div class="info-box-value">${esc(p.yarnColour||'—')}</div></div>
          <div class="info-box"><div class="info-box-label">Skeins</div><div class="info-box-value">${p.yarnSkeins||'—'}</div></div>
        </div>
      </div>
      ${p.pattern?`<div>
        <div class="detail-section-title">Pattern</div>
        <div class="info-box">${esc(p.pattern)}</div>
      </div>`:''}
      ${p.link?`<a href="${esc(p.link)}" target="_blank" rel="noopener" class="wish-link">${IC.link} Open pattern link</a>`:''}
      ${p.notes?`<div>
        <div class="detail-section-title">Notes</div>
        <div style="background:var(--surface2);border-radius:var(--radius-sm);padding:12px 14px;font-size:14px;line-height:1.6">${esc(p.notes)}</div>
      </div>`:''}
      ${p.photos&&p.photos.length>1?`<div>
        <div class="detail-section-title">Photos</div>
        <div class="photo-grid">${p.photos.map(ph=>`<div class="photo-thumb"><img src="${ph}" alt="" loading="lazy"></div>`).join('')}</div>
      </div>`:''}
    </div>`;
}

function backToProjects() {
  document.getElementById('projectDetail').style.display='none';
  document.getElementById('projectsList').style.display='';
  renderProjects();
}
function deleteProject(id) {
  if(!confirm('Delete this project?')) return;
  state.projects = state.projects.filter(p=>p.id!==id);
  save(); backToProjects();
}

document.querySelectorAll('[data-filter]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('[data-filter]').forEach(b=>b.classList.toggle('active',b===btn));
    projectFilter = btn.dataset.filter;
    renderProjects();
  });
});

document.getElementById('addProjectBtn').addEventListener('click', () => {
  projectPhotos=[]; renderProjectPhotoGrid(); openModal('projectModal');
});
document.getElementById('closeProjectModal').addEventListener('click', ()=>closeModal('projectModal'));

const projInput = document.getElementById('projectPhotoInput');
document.getElementById('projectPhotoUpload').addEventListener('click', ()=>projInput.click());
projInput.addEventListener('change', e => {
  Array.from(e.target.files).forEach(f => {
    const r=new FileReader();
    r.onload=ev=>{ projectPhotos.push(ev.target.result); renderProjectPhotoGrid(); };
    r.readAsDataURL(f);
  });
  e.target.value='';
});
function renderProjectPhotoGrid() {
  document.getElementById('projectPhotoGrid').innerHTML=projectPhotos.map((ph,i)=>
    `<div class="photo-thumb"><img src="${ph}" alt="" loading="lazy">
    <button class="photo-rm" onclick="rmProjPhoto(${i})">✕</button></div>`).join('');
}
function rmProjPhoto(i) { projectPhotos.splice(i,1); renderProjectPhotoGrid(); }

document.getElementById('saveProject').addEventListener('click', () => {
  const name=document.getElementById('pName').value.trim();
  if(!name){document.getElementById('pName').focus();return;}
  state.projects.unshift({
    id:uid(), name,
    status:document.getElementById('pStatus').value,
    progress:parseInt(document.getElementById('pProgress').value)||0,
    needle:document.getElementById('pNeedle').value.trim(),
    needleType:document.getElementById('pNeedleType').value,
    needleLen:document.getElementById('pNeedleLen').value.trim(),
    yarnBrand:document.getElementById('pYarnBrand').value.trim(),
    yarnName:document.getElementById('pYarnName').value.trim(),
    yarnColour:document.getElementById('pYarnColour').value.trim(),
    yarnSkeins:parseInt(document.getElementById('pYarnSkeins').value)||0,
    pattern:document.getElementById('pPattern').value.trim(),
    link:document.getElementById('pLink').value.trim(),
    notes:document.getElementById('pNotes').value.trim(),
    photos:[...projectPhotos]
  });
  save();
  ['pName','pProgress','pNeedle','pNeedleLen','pYarnBrand','pYarnName','pYarnColour','pYarnSkeins','pPattern','pLink','pNotes']
    .forEach(id=>{document.getElementById(id).value='';});
  projectPhotos=[]; renderProjectPhotoGrid();
  closeModal('projectModal'); renderProjects();
});

// ── PATTERNS ───────────────────────────────────────────────
let patternFilter='all', patternImg='';

function renderPatterns() {
  const g=document.getElementById('patternGrid');
  const list=patternFilter==='all'?state.patterns:state.patterns.filter(p=>p.category===patternFilter);
  if(!list.length){
    g.style.display='block';
    g.innerHTML=`<div class="empty" style="grid-column:span 2">${IC.doc}<div class="empty-title">No patterns yet</div><p>Add your first pattern</p></div>`;
    return;
  }
  g.style.display='grid';
  g.innerHTML=list.map(p=>`
    <div class="pattern-card">
      <div class="pattern-thumb">
        ${p.img?`<img src="${p.img}" alt="${esc(p.name)}" loading="lazy">`:IC.doc.replace('width:64px;height:64px','width:40px;height:40px')}
      </div>
      <div class="pattern-info">
        <div class="pattern-name">${esc(p.name)}</div>
        <div class="pattern-designer">${esc(p.designer||'Unknown')}</div>
        ${p.needle?`<div style="margin-top:6px"><span class="tag tag-needle">🪡 ${esc(p.needle)}mm</span></div>`:''}
        ${p.link?`<a href="${esc(p.link)}" target="_blank" rel="noopener" class="wish-link" style="margin-top:8px">${IC.link} View</a>`:''}
      </div>
    </div>`).join('');
}

document.querySelectorAll('[data-pfilter]').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('[data-pfilter]').forEach(b=>b.classList.toggle('active',b===btn));
    patternFilter=btn.dataset.pfilter; renderPatterns();
  });
});
document.getElementById('addPatternBtn').addEventListener('click',()=>{patternImg='';openModal('patternModal');});
document.getElementById('closePatternModal').addEventListener('click',()=>closeModal('patternModal'));
const patInput=document.getElementById('patternPhotoInput');
document.getElementById('patternPhotoUpload').addEventListener('click',()=>patInput.click());
patInput.addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=ev=>{
    patternImg=ev.target.result;
    document.getElementById('patternPhotoUpload').innerHTML=`<img src="${patternImg}" style="width:100%;height:120px;object-fit:cover;border-radius:8px">`;
  };
  r.readAsDataURL(f); e.target.value='';
});
document.getElementById('savePattern').addEventListener('click',()=>{
  const name=document.getElementById('ptName').value.trim();
  if(!name){document.getElementById('ptName').focus();return;}
  state.patterns.unshift({id:uid(),name,
    designer:document.getElementById('ptDesigner').value.trim(),
    category:document.getElementById('ptCategory').value,
    needle:document.getElementById('ptNeedle').value.trim(),
    link:document.getElementById('ptLink').value.trim(),
    notes:document.getElementById('ptNotes').value.trim(),
    img:patternImg});
  save();
  ['ptName','ptDesigner','ptNeedle','ptLink','ptNotes'].forEach(id=>{document.getElementById(id).value='';});
  patternImg='';
  document.getElementById('patternPhotoUpload').innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="width:32px;height:32px;opacity:.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg><span>Add cover image</span>`;
  closeModal('patternModal'); renderPatterns();
});

// ── STORAGE ────────────────────────────────────────────────
let storageTab='yarn';
document.querySelectorAll('[data-stab]').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('[data-stab]').forEach(b=>b.classList.toggle('active',b===btn));
    storageTab=btn.dataset.stab;
    document.getElementById('yarnList').style.display=storageTab==='yarn'?'flex':'none';
    document.getElementById('needleList').style.display=storageTab==='needles'?'flex':'none';
  });
});
function renderYarns(){
  const el=document.getElementById('yarnList');
  if(!state.yarns.length){el.innerHTML=`<div class="empty">${IC.knit}<div class="empty-title">Empty stash</div><p>Add yarn from your stash</p></div>`;return;}
  el.innerHTML=state.yarns.map(y=>`
    <div class="yarn-card">
      <div class="yarn-swatch" style="background:${y.hex||'#888'}"></div>
      <div class="yarn-info">
        <div class="yarn-name">${esc(y.brand)} – ${esc(y.name)}</div>
        <div class="yarn-detail">${esc(y.colour||'')} · ${esc(y.weight||'')} · ${esc(y.fibre||'')}</div>
        ${y.metres||y.grams?`<div class="yarn-detail" style="font-variant-numeric:tabular-nums">${y.metres?y.metres+'m':''}${y.metres&&y.grams?' / ':''}${y.grams?y.grams+'g':''} per skein</div>`:''}
      </div>
      <div class="yarn-qty">${y.skeins||1} skein${(y.skeins||1)!=1?'s':''}</div>
    </div>`).join('');
}
function renderNeedles(){
  const el=document.getElementById('needleList');
  if(!state.needles.length){el.innerHTML=`<div class="empty">${IC.needleBig}<div class="empty-title">No needles</div><p>Track your needle collection</p></div>`;return;}
  el.innerHTML=state.needles.map(n=>`
    <div class="needle-card">
      <div class="needle-icon">${IC.needleBig}</div>
      <div class="needle-info">
        <div class="yarn-name">${esc(n.size)}mm – ${esc(n.type)}</div>
        <div class="yarn-detail">${n.length?esc(n.length)+'cm · ':''}${esc(n.material||'')}${n.brand?' · '+esc(n.brand):''}</div>
      </div>
      <div class="yarn-qty">×${n.qty||1}</div>
    </div>`).join('');
}
document.querySelectorAll('[data-stform]').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('[data-stform]').forEach(b=>b.classList.toggle('active',b===btn));
    const v=btn.dataset.stform;
    document.getElementById('yarnForm').style.display=v==='yarn'?'':'none';
    document.getElementById('needleForm').style.display=v==='needle'?'':'none';
  });
});
document.getElementById('addStorageBtn').addEventListener('click',()=>openModal('storageModal'));
document.getElementById('closeStorageModal').addEventListener('click',()=>closeModal('storageModal'));
document.getElementById('saveYarn').addEventListener('click',()=>{
  const name=document.getElementById('yName').value.trim();
  if(!name){document.getElementById('yName').focus();return;}
  state.yarns.unshift({id:uid(),
    brand:document.getElementById('yBrand').value.trim(), name,
    colour:document.getElementById('yColour').value.trim(),
    hex:document.getElementById('yHex').value,
    weight:document.getElementById('yWeight').value,
    skeins:parseInt(document.getElementById('ySkeins').value)||1,
    metres:parseInt(document.getElementById('yMetres').value)||0,
    grams:parseInt(document.getElementById('yGrams').value)||0,
    fibre:document.getElementById('yFibre').value.trim(),
    notes:document.getElementById('yNotes').value.trim()});
  save();
  ['yBrand','yName','yColour','yFibre','yNotes'].forEach(id=>{document.getElementById(id).value='';});
  document.getElementById('ySkeins').value=1;
  document.getElementById('yMetres').value='';
  document.getElementById('yGrams').value='';
  closeModal('storageModal'); renderYarns();
});
document.getElementById('saveNeedle').addEventListener('click',()=>{
  const size=document.getElementById('nSize').value.trim();
  if(!size){document.getElementById('nSize').focus();return;}
  state.needles.unshift({id:uid(), size,
    type:document.getElementById('nType').value,
    length:document.getElementById('nLength').value.trim(),
    material:document.getElementById('nMaterial').value,
    brand:document.getElementById('nBrand').value.trim(),
    qty:parseInt(document.getElementById('nQty').value)||1,
    notes:document.getElementById('nNotes').value.trim()});
  save();
  ['nSize','nLength','nBrand','nNotes'].forEach(id=>{document.getElementById(id).value='';});
  document.getElementById('nQty').value=1;
  closeModal('storageModal'); renderNeedles();
});

// ── WISH LIST ──────────────────────────────────────────────
function renderFuture(){
  const el=document.getElementById('futureCards');
  if(!state.future.length){el.innerHTML=`<div class="empty">${IC.heart}<div class="empty-title">Wish list is empty</div><p>Save patterns and projects you'd love to knit</p></div>`;return;}
  const pi={high:'🔥',medium:'⭐',low:'💤'};
  const pc={high:'var(--accent)',medium:'var(--tag-needle)',low:'var(--border)'};
  el.innerHTML=state.future.map(f=>`
    <div class="wish-card">
      <div class="wish-bar" style="background:${pc[f.priority]||'var(--border)'}"></div>
      <div class="wish-body">
        <div class="wish-name">${esc(f.name)}</div>
        <div class="wish-meta">
          <span>${pi[f.priority]||''} ${f.priority}</span>
          <span>· ${esc(f.category)}</span>
          ${f.yarn?`<span>· ${esc(f.yarn)}</span>`:''}
        </div>
        ${f.pattern?`<div style="font-size:12.5px;color:var(--fg2);margin-top:4px">${esc(f.pattern)}</div>`:''}
        ${f.notes?`<div style="font-size:13px;margin-top:6px">${esc(f.notes)}</div>`:''}
        ${f.link?`<a href="${esc(f.link)}" target="_blank" rel="noopener" class="wish-link">${IC.link} View pattern</a>`:''}
      </div>
      <div class="wish-actions">
        <button class="icon-btn" onclick="startFuture('${f.id}')" title="Start project" style="color:var(--tag-yarn)">${IC.play}</button>
        <button class="icon-btn" onclick="deleteFuture('${f.id}')" title="Remove">${IC.trash}</button>
      </div>
    </div>`).join('');
}
function deleteFuture(id){state.future=state.future.filter(f=>f.id!==id);save();renderFuture();}
function startFuture(id){
  const f=state.future.find(x=>x.id===id); if(!f) return;
  state.projects.unshift({id:uid(),name:f.name,status:'active',progress:0,
    needle:'',needleType:'Circular',needleLen:'',yarnBrand:'',
    yarnName:f.yarn||'',yarnColour:'',yarnSkeins:0,
    pattern:f.pattern||'',link:f.link||'',notes:f.notes||'',photos:[]});
  state.future=state.future.filter(x=>x.id!==id);
  save(); renderFuture(); renderProjects();
  document.querySelector('[data-tab="projects"]').click();
}
document.getElementById('addFutureBtn').addEventListener('click',()=>openModal('futureModal'));
document.getElementById('closeFutureModal').addEventListener('click',()=>closeModal('futureModal'));
document.getElementById('saveFuture').addEventListener('click',()=>{
  const name=document.getElementById('fName').value.trim();
  if(!name){document.getElementById('fName').focus();return;}
  state.future.unshift({id:uid(),name,
    category:document.getElementById('fCategory').value,
    priority:document.getElementById('fPriority').value,
    pattern:document.getElementById('fPattern').value.trim(),
    link:document.getElementById('fLink').value.trim(),
    yarn:document.getElementById('fYarn').value.trim(),
    notes:document.getElementById('fNotes').value.trim()});
  save();
  ['fName','fPattern','fLink','fYarn','fNotes'].forEach(id=>{document.getElementById(id).value='';});
  closeModal('futureModal'); renderFuture();
});

// ── Init ───────────────────────────────────────────────────
renderProjects(); renderPatterns(); renderYarns(); renderNeedles(); renderFuture();
</script>
</body>
</html>
